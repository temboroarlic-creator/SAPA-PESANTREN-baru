<style>
:root{--ink:#0b1b2b;--muted:#5d6d7e;--teal:#0f766e;--ink2:#33475b;--tg:#1b7d37;--tb:#0a5bbd;--to:#9a5b00;--tr:#b3190f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);background:#e6f4f1;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.muted{color:var(--muted)}

/* ---------- Latar bergradasi + blob (membuat efek kaca terlihat) ---------- */
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#dcf7ec 0%,#e2eeff 55%,#fdf2d6 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(55px);opacity:.8;animation:float 16s ease-in-out infinite}
.b1{width:320px;height:320px;background:#34d399;top:-90px;left:-100px}
.b2{width:290px;height:290px;background:#60a5fa;top:32%;right:-110px;animation-delay:-6s}
.b3{width:270px;height:270px;background:#fbbf24;bottom:-100px;left:12%;animation-delay:-10s;opacity:.55}
@keyframes float{50%{transform:translate(26px,-34px) scale(1.1)}}

/* ---------- Kaca (glassmorphism / "liquid glass" ala iOS) ---------- */
.glass{
  background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.38));
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);border-radius:28px;
  box-shadow:0 12px 32px rgba(20,60,90,.12),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35);
}
.glass-sm{border-radius:22px}
.wrap{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 130px}
.sec{font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.mt3{margin-top:12px}

/* ---------- Komponen ---------- */
.logo{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#34d399,#0f766e);box-shadow:0 14px 30px rgba(15,118,110,.4),inset 0 1px 1px rgba(255,255,255,.6)}
.avatar{width:50px;height:50px;border-radius:18px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;
  background:linear-gradient(145deg,#34d399,#0f766e)}
.field{width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.7);
  padding:14px 16px;font-size:16px;color:var(--ink);outline:none;font-family:inherit;box-shadow:inset 0 1px 3px rgba(0,0,0,.05)}
.field:focus{border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,.18)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 4px}
.btn{border:0;border-radius:18px;padding:15px 20px;font-weight:700;font-size:16px;color:#fff;
  background:linear-gradient(135deg,#10b981,#0d9488);box-shadow:0 10px 22px rgba(13,148,136,.35);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55}
.mini{border:0;border-radius:14px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--teal);background:rgba(16,185,129,.15)}
.ic{display:inline-flex;vertical-align:-3px;margin-right:6px}.ic svg{display:block}
.iconbtn svg{display:block}.iconbtn .ic{margin:0}
.lnic svg{display:block}
.k-tile{width:76px;height:76px;margin:0 auto;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,#34d399,#0f9d8a);color:#fff;box-shadow:0 10px 26px rgba(15,157,138,.35)}
.iconbtn{border:0;width:42px;height:42px;border-radius:15px;background:rgba(255,255,255,.6);color:var(--ink);font-size:22px;display:grid;place-items:center;flex:none}
.iconbtn[disabled]{opacity:.3}
.chip{border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.5);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;color:#2b3d4f;white-space:nowrap;flex:none}
.chip.on{background:var(--teal);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(15,118,110,.35)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-ok{font-size:11px;font-weight:700;color:#1f8f3e;background:rgba(52,199,89,.18);border-radius:999px;padding:4px 10px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.stat{display:flex;flex-direction:column;align-items:center;min-width:44px}
.stat b{font-size:20px;line-height:1.1}.stat span{font-size:11px;color:var(--muted)}

/* Segmented control (tombol cepat Hadir/Izin/Sakit/Alfa) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:rgba(110,125,145,.16);border-radius:17px}
.seg button{border:0;background:transparent;border-radius:13px;padding:11px 2px;font-weight:700;font-size:13px;color:#4b5b6b;transition:all .18s}
.seg button:active{transform:scale(.94)}
.seg button.on{color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.seg button.on[data-c=g]{background:linear-gradient(180deg,#4cd964,#2fb350)}
.seg button.on[data-c=b]{background:linear-gradient(180deg,#3d9bff,#0a74ee)}
.seg button.on[data-c=o]{background:linear-gradient(180deg,#ffb340,#f08c00)}
.seg button.on[data-c=r]{background:linear-gradient(180deg,#ff6259,#e8281d)}
.seg.light button{font-size:15px;padding:12px 2px}
.seg.light button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.12)}

.card{padding:14px 14px 12px;margin-top:10px}
.nm{font-weight:700;font-size:16px}
.note{padding:11px 14px;font-size:15px}

/* Tab bar bawah */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(92vw,420px);display:flex;gap:4px;padding:6px;border-radius:32px;z-index:30}
.tabbar button{flex:1;border:0;background:transparent;border-radius:26px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:11px;font-weight:700;color:#6b7b8b;transition:all .2s}
.tabbar button.on{background:rgba(255,255,255,.85);color:var(--teal);box-shadow:0 4px 12px rgba(20,60,90,.12)}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));width:min(92vw,420px);z-index:25}

/* Banner */
.alert{border-radius:20px;padding:12px 14px;font-size:14px;font-weight:600;margin-top:12px;border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.alert.red{background:rgba(255,59,48,.16);color:#b3190f}
.alert.amber{background:rgba(255,159,10,.18);color:#9a5b00}
.alert.green{background:rgba(52,199,89,.16);color:#1b7d37}
.alert.demo{background:rgba(10,132,255,.14);color:#0a5bbd;margin-top:0;margin-bottom:12px;font-size:13px}

/* Grid sholat */
.shgrid{display:grid;grid-template-columns:54px repeat(5,1fr);gap:7px;align-items:center}
.shgrid .th{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.shgrid .tg{font-size:12px;font-weight:600;color:var(--ink2)}
.cell{height:34px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.cell.empty{background:rgba(110,125,145,.15);color:#9aa8b5;font-weight:600}

.bar{height:12px;border-radius:99px;background:rgba(110,125,145,.18);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34d399,#0d9488)}

/* Sheet (form tahfidz) */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,520px);z-index:41;border-radius:32px 32px 0 0;
  padding:12px 18px calc(22px + env(safe-area-inset-bottom));background:rgba(255,255,255,.82);animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(0,0,0,.18);margin:0 auto 12px}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}

/* Toast */
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);z-index:60;max-width:92vw;
  padding:12px 18px;border-radius:20px;font-weight:600;font-size:14px;color:#fff;background:rgba(18,30,42,.86);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:transform .35s cubic-bezier(.2,.9,.3,1);text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast.err{background:rgba(200,35,25,.92)}#toast.warn{background:rgba(190,115,0,.94)}

.sk{height:110px;border-radius:26px;margin-top:12px;background:linear-gradient(90deg,rgba(255,255,255,.3),rgba(255,255,255,.7),rgba(255,255,255,.3));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.dim{opacity:.55;pointer-events:none;transition:opacity .2s}
.empty-s{text-align:center;color:var(--muted);padding:34px 10px;font-weight:600}
.bd-g{background:rgba(52,199,89,.17);color:var(--tg)}.bd-b{background:rgba(10,132,255,.15);color:var(--tb)}
.bd-o{background:rgba(255,159,10,.19);color:var(--to)}.bd-r{background:rgba(255,59,48,.15);color:var(--tr)}
.dateinp{border:0;background:rgba(255,255,255,.6);border-radius:12px;padding:9px 12px;font-size:16px;font-family:inherit;font-weight:600;color:var(--ink)}
</style>
<style>

html[data-tema] .logo,html[data-tema] .avatar{background:var(--accent);color:var(--on);box-shadow:none}

/* ---- Pemilih tema (lembar bawah) ---- */
.tm-scrim{position:fixed;inset:0;background:rgba(10,20,30,.4);z-index:90}

/* ===== Tata letak responsif: HP (bawaan) · tablet · desktop. Menu tetap di bawah seperti iPhone ===== */

.card .nm{letter-spacing:-.01em}

<script>
/* Tema SAPA Pesantren — pemilih & penyimpan tema (dipakai index.html & kiosk.html).
 * Pilihan disimpan di perangkat masing-masing (localStorage). */
(function () {
  var TEMAS = [
    ['kaca', 'Kaca', 'Efek kaca ala iPhone', 'linear-gradient(135deg,#6ee7b7,#93c5fd)', ['rgba(255,255,255,.8)', 'rgba(255,255,255,.55)']],
    ['samsung', 'Samsung', 'Datar bergaya One UI — paling ringan', '#f2f3f5', ['#ffffff', '#3e91ff']],
    ['gelap', 'Gelap', 'Nyaman di ruangan redup, hemat baterai', '#0d1217', ['#232f3b', '#34d399']],
    ['hijau', 'Hijau Pesantren', 'Datar, hijau dan krem', '#f4f1e8', ['#ffffff', '#15803d']]
  ];
  var META = { kaca: '#0f766e', samsung: '#f2f3f5', gelap: '#0d1217', hijau: '#15803d' };

  function get() { try { return localStorage.getItem('sapa_tema') || 'kaca'; } catch (e) { return 'kaca'; } }
  function apply(t) {
    if (!META[t]) t = 'kaca';
    var h = document.documentElement;
    if (t === 'kaca') h.removeAttribute('data-tema'); else h.setAttribute('data-tema', t);
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', META[t]);
  }
  function set(t) {
    try { localStorage.setItem('sapa_tema', t); } catch (e) {}
    var h = document.documentElement; h.classList.add('tema-anim'); apply(t);
    clearTimeout(set._t); set._t = setTimeout(function () { h.classList.remove('tema-anim'); }, 600);
  }
  function close() { var r = document.getElementById('tm-root'); if (r) r.remove(); }
  function open() {

  const W = 320, H = 120, bw = 30, step = W/seri.length;
  const tot = s => keys.reduce((a,k)=>a+s[k],0), max = Math.max(1, ...seri.map(tot));
  return `<svg viewBox="0 0 ${W} ${H+34}" style="width:100%">` + seri.map((s,i)=>{
    const x = i*step + (step-bw)/2; let y = H + 6; const on = s.bulan === sel;
    const segs = keys.map(k=>{ const h = (H-12)*s[k]/max; y -= h; return h>0 ? `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${col[k]}" opacity="${on?1:.5}" stroke="rgba(255,255,255,.9)" stroke-width="1"/>` : ''; }).join('');
    return `<g data-act="bulan" data-b="${s.bulan}" style="cursor:pointer"><rect x="${i*step}" y="0" width="${step}" height="${H+34}" fill="transparent"/>${segs}<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink2)">${tot(s)||''}</text><text x="${x+bw/2}" y="${H+24}" text-anchor="middle" font-size="11" font-weight="${on?800:500}" style="fill:${on?'var(--teal)':'var(--muted)'}">${BLN[+s.bulan.slice(5,7)-1]}</text></g>`;
  }).join('') + '</svg>';
}
function areaLine(pts){
  const W = 320, H = 130, P = 14, n = pts.length, max = Math.max(1, ...pts.map(p=>p.value));
  const xs = i => n>1 ? P + i*(W-2*P)/(n-1) : W/2;
  const ys = v => H - P - (H-2*P-14)*v/max;
  let d = ''; pts.forEach((p,i)=>{ const x = xs(i), y = ys(p.value); if(!i) d += `M${x},${y}`; else { const px = xs(i-1), py = ys(pts[i-1].value), cx = (px+x)/2; d += ` C${cx},${py} ${cx},${y} ${x},${y}`; } });
  const area = d + ` L${xs(n-1)},${H-P} L${xs(0)},${H-P} Z`;
  return `<svg viewBox="0 0 ${W} ${H+24}" style="width:100%"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981" stop-opacity=".45"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/><path d="${d}" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p.value)}" r="4.5" fill="#fff" stroke="#0d9488" stroke-width="2.5"/><text x="${xs(i)}" y="${ys(p.value)-10}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--ink2)">${p.value}</text><text x="${xs(i)}" y="${H+16}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(p.label)}</text>`).join('')}</svg>`;
}

  } catch(e){ toast(e.message, 'err'); if (/PIN|Username/.test(e.message)) { logout(); return; } }

async function loadSantri(){
  if (!S.kelas) { S.loading = false; renderAdminBody(); return; }
  const my = ++reqId; S.loading = true; renderAdminBody();
  try {
    const jenis = S.otab;
    const d = await postApi({ action:'santri', pin:S.pin, kelas:S.kelas, tanggal:S.tanggal, jenis, waktu:S.waktu, sesi:S.sesiK });
    if (my !== reqId) return;
    S.santri = d.santri; S.saved = d.tersimpan || {}; S.marks = {};
    d.santri.forEach(s => {
      const t = S.saved[s.nis];
      if (jenis==='kelas') S.marks[s.nis] = { status:(t&&t.status)||'', catatan:(t&&t.catatan)||'' };
      else if (jenis==='sholat') S.marks[s.nis] = { status:(t&&t.status)||'' };
    });
    if (jenis==='kelas' && d.izin) d.santri.forEach(s => { const iz = d.izin[s.nis], m = S.marks[s.nis]; if (iz && m && !m.status && STATUS_KELAS.some(x=>x[0]===iz.jenis)) S.marks[s.nis] = { status:iz.jenis, catatan:'Izin ortu: ' + (iz.alasan||'').slice(0,60) }; });
  } catch(e){
    if (my !== reqId) return;
    if (/Jam pelajaran/.test(e.message) && !S._pulih) {
      S._pulih = 1;
      try { const g = await postApi({ action:'getPengaturan', pin:S.pin }); terapkanPengaturan(g.pengaturan); S.sesiK = SESI_KELAS[0] || ''; } catch(x){}
      render(); return loadSantri();
    }
    toast(e.message, 'err'); S.santri = [];
  }
  S._pulih = 0; S.loading = false; renderAdminBody();
}

async function submitBody(body){
  S.busy = true; const btn = $('#btn-save'); if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  try {

    if (e.offline) { outbox.set(outbox.get().concat([body])); toast('Offline — disimpan di perangkat, dikirim otomatis saat online', 'warn'); return true; }
    toast(e.message, 'err'); return false;
  } finally { S.busy = false; }
}
async function saveBatch(){
  const items = S.santri.filter(s => S.marks[s.nis] && S.marks[s.nis].status).map(s => ({ nis:s.nis, status:S.marks[s.nis].status, catatan:S.marks[s.nis].catatan||'' }));

    return `<g data-act="${act}" data-i="${i}" style="cursor:pointer"><rect x="${i*step}" y="0" width="${step}" height="${H+34}" fill="transparent"/>${segs}${i%every===0?`<text x="${x+bw/2}" y="${H+24}" text-anchor="middle" font-size="10" font-weight="${on?800:500}" style="fill:${on?'var(--teal)':'var(--muted)'}">${esc(s.label)}</text>`:''}</g>`;

function demoRekap(b){
  const dari = b.dari, sampai = b.sampai, n = rkDiff(dari, sampai);
  if (n < 1) throw new Error('Tanggal "sampai" harus sama atau setelah "dari"');
  if (n > 732) throw new Error('Rentang maksimal 2 tahun');
  const gran = b.gran || 'hari', mw = +b.mulaiMinggu;
  const bk = rkBuckets(dari, sampai, gran, mw);
  const jenis = b.jenis, keys = jenis==='kelas' ? STATUS_KELAS.map(x=>x[0]) : jenis==='sholat' ? STATUS_SHOLAT.map(x=>x[0]) : ['ayat','setoran'];
  const nol = () => { const o = {}; keys.forEach(k=>o[k]=0); return o; };
  const hash = s => { let h = 7; for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; };
  const rnd = s => (hash(s) % 10000)/10000;
  const ss = DEMO_SANTRI.filter(s => !b.kelas || s.kelas===b.kelas);
  const sesiList = SESI_KELAS.length ? SESI_KELAS.slice() : ['Harian'], perS = {};
  sesiList.forEach(n => perS[n] = Object.assign({ sesi:n }, nol()));
  const seri = bk.map(x => Object.assign({ label:x.label, mulai:x.mulai, akhir:x.akhir }, nol()));
  const total = nol(), per = {}, perK = {}, perW = {}, kual = {Lancar:0,Cukup:0,'Perlu Ulang':0};
  ss.forEach(s => { per[s.nis] = nol(); if (!perK[s.kelas]) perK[s.kelas] = Object.assign({kelas:s.kelas, jumlahSantri:0}, nol()); perK[s.kelas].jumlahSantri++; });
  WAKTU.forEach(w => perW[w] = Object.assign({waktu:w}, nol()));
  const kenaI = {}; let bi = 0; bk.forEach((x,i) => { for (let t=x.mulai; t<=x.akhir; t=rkAdd(t,1)) kenaI[t] = i; });
  const catat = (s, i, k, w) => { seri[i][k]++; total[k]++; per[s.nis][k]++; perK[s.kelas][k]++; if (w) perW[w][k]++; };
  Object.keys(kenaI).forEach(t => {
    const i = kenaI[t], dow = new Date(t+'T00:00:00Z').getUTCDay();
    ss.forEach(s => {
      const bias = rnd('b'+s.nis)*0.12;
      if (jenis==='kelas') { if (dow===5) return; sesiList.forEach(sn => { if (b.sesi && sn!==b.sesi) return; const r = rnd(s.nis+t+sn), k = r<0.8-bias?'Hadir':r<0.88?'Izin':r<0.94?'Sakit':'Alfa'; catat(s, i, k); perS[sn][k]++; }); }
      else if (jenis==='sholat') WAKTU.forEach(w => { const r = rnd(s.nis+t+w); catat(s, i, r<0.74-bias?'Berjamaah':r<0.86?'Masbuq':r<0.91?'Uzur':'Alfa', w); });
      else { const r = rnd('t'+s.nis+t); if (r<0.35) { const a = 3 + Math.floor(rnd('a'+s.nis+t)*10); seri[i].ayat += a; seri[i].setoran++; total.ayat += a; total.setoran++; per[s.nis].ayat += a; per[s.nis].setoran++; perK[s.kelas].ayat += a; perK[s.kelas].setoran++; kual[['Lancar','Cukup','Perlu Ulang'][Math.min(2, Math.floor(rnd('q'+s.nis+t)*3.6))]]++; } }
    });
  });
  const utama = jenis==='kelas' ? 'Hadir' : 'Berjamaah', pak = jenis!=='tahfidz';
  const pct = o => { const t = keys.reduce((a,k)=>a+o[k],0); return t ? Math.round(1000*o[utama]/t)/10 : null; };
  if (pak) total.persen = pct(total);
  let santri = ss.map(s => Object.assign({nis:s.nis, nama:s.nama, kelas:s.kelas}, per[s.nis], pak?{persen:pct(per[s.nis])}:{}));
  if (pak) { santri = santri.filter(x=>x.persen!=null);
    santri.sort(b.urut==='tinggi' ? (x,y)=>y.persen-x.persen : b.urut==='rendah' ? (x,y)=>x.persen-y.persen : (x,y)=>y.Alfa-x.Alfa || x.persen-y.persen); }
  else santri.sort(b.urut==='rendah' ? (x,y)=>x.ayat-y.ayat : (x,y)=>y.ayat-x.ayat);
  const out = { jenis, dari, sampai, gran, mulaiMinggu:mw, kelas:b.kelas||'', jumlahSantri:ss.length, hariKalender:n, seri, total,
    perKelas:Object.keys(perK).sort().map(k=>{ const o = perK[k]; if (pak) o.persen = pct(o); return o; }), santri:santri.slice(0, b.batas||30), totalSantriDaftar:santri.length };
  if (jenis==='kelas' && SESI_KELAS.length>1) out.sesi = sesiList.map(n => { const o = perS[n]; o.persen = pct(o); return o; });
  if (jenis==='sholat') out.waktu = WAKTU.map(w => { const o = perW[w]; o.persen = pct(o); return o; });
  if (jenis==='tahfidz') { out.kualitas = kual; out.aktif = ss.filter(s=>per[s.nis].ayat>0).length; }
  return out;
}

const TR = { dari:rkAdd(todayStr(),-29), sampai:todayStr(), preset:'30', gran:'hari', mw:1, data:null, loading:false, sel:null, req:0 };
function rkBuckets(dari, sampai, gran, mw){
  const out = []; let cur = dari;
  while (cur <= sampai) {
    const dow = new Date(cur+'T00:00:00Z').getUTCDay();
    let end = gran==='hari' ? cur : gran==='minggu' ? rkAdd(cur, 6-((dow-mw+7)%7)) : gran==='tahun' ? cur.slice(0,4)+'-12-31' : (()=>{ const d = new Date(Date.UTC(+cur.slice(0,4), +cur.slice(5,7), 0)); return cur.slice(0,8)+pad(d.getUTCDate()); })();
    if (end > sampai) end = sampai;
    const a = +cur.slice(8,10), z = +end.slice(8,10), ma = BLN[+cur.slice(5,7)-1], mz = BLN[+end.slice(5,7)-1];
    out.push({ mulai:cur, akhir:end, label: gran==='tahun' ? cur.slice(0,4) : gran==='bulan' ? ma+' '+cur.slice(0,4) : cur===end ? a+' '+ma : (cur.slice(5,7)===end.slice(5,7) ? a+'–'+z+' '+ma : a+' '+ma+'–'+z+' '+mz) });
    cur = rkAdd(end,1);
  }
  return out;
}
function trPreset(p){
  const t = todayStr(); TR.preset = p;
  if (p==='7') { TR.dari = rkAdd(t,-6); TR.sampai = t; }
  else if (p==='30') { TR.dari = rkAdd(t,-29); TR.sampai = t; }
  else if (p==='bulan') { TR.dari = t.slice(0,8)+'01'; TR.sampai = t; }
  else if (p==='lalu') { const e = rkAdd(t.slice(0,8)+'01',-1); TR.dari = e.slice(0,8)+'01'; TR.sampai = e; }
  else if (p==='tahun') { TR.dari = t.slice(0,4)+'-01-01'; TR.sampai = t; }
  trFixGran();
}

function demoTahfidzRentang(p, s){
  const dari = p.dari, sampai = p.sampai;
  if (rkDiff(dari, sampai) < 1) throw new Error('Tanggal "sampai" harus sama atau setelah "dari"');
  if (rkDiff(dari, sampai) > 732) throw new Error('Rentang maksimal 2 tahun');
  const gran = p.gran || 'hari', mw = +p.mulaiMinggu;
  const bk = rkBuckets(dari, sampai, gran, mw);
  const hash = x => { let h = 2166136261; for (let i=0;i<x.length;i++) { h ^= x.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h>>>13; h = Math.imul(h, 0x5bd1e995); h ^= h>>>15; return h>>>0; };
  const rnd = x => (hash(x) % 10000)/10000;
  const idx = {}; bk.forEach((x,i) => { for (let t=x.mulai; t<=x.akhir; t=rkAdd(t,1)) idx[t] = i; });
  const seri = bk.map(x => ({ label:x.label, mulai:x.mulai, akhir:x.akhir, ayat:0, setoran:0 }));
  const daftar = [], kual = { Lancar:0, Cukup:0, 'Perlu Ulang':0 }; let total = 0;
  Object.keys(idx).forEach(t => {
    if (rnd('t'+s.nis+t) >= 0.4) return;
    const nama = SURAH[hash('s'+s.nis+t.slice(0,7)) % 114], aw = 1 + Math.floor(rnd('a'+s.nis+t)*20), n = 3 + Math.floor(rnd('n'+s.nis+t)*10);
    const q = ['Lancar','Lancar','Cukup','Perlu Ulang'][Math.floor(rnd('q'+s.nis+t)*4)];
    seri[idx[t]].ayat += n; seri[idx[t]].setoran++; total += n; kual[q]++;
    daftar.push({ tanggal:t, surat_ayat:nama+' '+aw+'-'+(aw+n-1), kualitas:q, catatan:q==='Perlu Ulang'?'Ulangi bacaan, perhatikan tajwid':'', ayat:n });
  });
  daftar.sort((a,b)=>a.tanggal<b.tanggal?1:-1);
  return { dari, sampai, gran, mulaiMinggu:mw, seri, totalAyat:total, totalSetoran:daftar.length, hariAktif:daftar.length, hariKalender:rkDiff(dari,sampai), kualitas:kual, daftar:daftar.slice(0,300), terpotong:daftar.length>300 };
}

const PG_ACTIONS = {
  pgHapusStatus(d){ PG.cfg[d.k].splice(+d.i,1); PG.dirty = true; pgRedo(); },
  pgTambahStatus(d){
    const n = pgVal('pg-st-'+d.k); if (!n) return toast('Isi nama status','warn');
    if (PG.cfg[d.k].some(x=>x[0].toLowerCase()===n.toLowerCase())) return toast('Status sudah ada','warn');
    if (PG.cfg[d.k].length >= 10) return toast('Maksimal 10 status','warn');
    PG.cfg[d.k].push([n,'b']); PG.dirty = true; pgRedo(); toast('Status "'+n+'" ditambah — pilih warna lalu Simpan');
  },
  pgToggleSesi(d){ const x = PG.cfg.sesi[+d.i]; x[1] = x[1]?0:1; PG.dirty = true; pgRedo(); },
  pgHapusSesi(d){
    if (PG.cfg.sesi.length<=1) return toast('Minimal satu sesi','warn');
    if (!confirm('Hapus sesi ini dari pilihan? Data lama tetap tersimpan.')) return;
    PG.cfg.sesi.splice(+d.i,1); PG.dirty = true; pgRedo();
  },
  pgTambahSesi(){
    const n = pgVal('pg-sesi-baru'); if (!n) return toast('Isi nama sesi','warn');
    if (PG.cfg.sesi.some(x=>x[0].toLowerCase()===n.toLowerCase())) return toast('Sesi sudah ada','warn');
    PG.cfg.sesi.push([n,1]); PG.dirty = true; pgRedo(); toast('Sesi "'+n+'" ditambah — jangan lupa Simpan');
  },
  pgBuatSesiKelas(){
    const n = Math.round(+pgVal('pg-nkelas')); if (!(n>=1 && n<=15)) return toast('Isi 1–15','warn');
    if (!confirm('Ganti daftar jam pelajaran menjadi '+(n===1?'satu absen per hari ("Harian")':'Jam 1 … Jam '+n)+'? Data lama tetap tersimpan.')) return;
    PG.cfg.sesiKelas = n===1 ? [['Harian',1]] : Array.from({length:n},(_,i)=>['Jam '+(i+1),1]); PG.dirty = true; pgRedo();
  },
  pgToggleSesiK(d){ const x = PG.cfg.sesiKelas[+d.i]; x[1] = x[1]?0:1; PG.dirty = true; pgRedo(); },
  pgHapusSesiK(d){
    if (PG.cfg.sesiKelas.length<=1) return toast('Minimal satu jam pelajaran','warn');
    if (!confirm('Hapus jam pelajaran ini dari pilihan? Data lama tetap tersimpan.')) return;
    PG.cfg.sesiKelas.splice(+d.i,1); PG.dirty = true; pgRedo();
  },
  pgTambahSesiK(){
    const n = pgVal('pg-sesik-baru'); if (!n) return toast('Isi nama jam','warn');
    if (PG.cfg.sesiKelas.some(x=>x[0].toLowerCase()===n.toLowerCase())) return toast('Nama sudah ada','warn');
    if (PG.cfg.sesiKelas.length>=15) return toast('Maksimal 15','warn');
    PG.cfg.sesiKelas.push([n,1]); PG.dirty = true; pgRedo();
  },
  pgHitung(d){ PG.cfg.alfa.hitungKelas = d.k; PG.dirty = true; pgRedo(); },
  pgKelasBaru(){ const n = (prompt('Nama kelas baru') || '').trim(); if (!n) return; if (n.length>30) return toast('Maksimal 30 karakter','warn'); if (!PG.cfg.kelasTambahan.includes(n)) PG.cfg.kelasTambahan.push(n); PG.dirty = true; pgRedo(); },
  pgForm(){ PG.tambah = true; PG.edit = null; PG.impor = false; PG.hasil = null; pgRedo(); },
  pgImpor(){ PG.impor = true; PG.tambah = false; PG.edit = null; PG.hasil = null; pgRedo(); },
  pgBatal(){ PG.tambah = PG.impor = false; PG.edit = null; pgRedo(); },
  pgEdit(d){ PG.edit = PG.daftar.baris.find(s=>s.nis===d.nis) || null; PG.tambah = false; PG.impor = false; pgRedo(); window.scrollTo({ top:0 }); },
  pgMore(){ pgCariLoad(true); },
  async pgHapusSantri(d){
    const s = PG.daftar.baris.find(x=>x.nis===d.nis);
    if (!confirm('Hapus '+(s?s.nama:'santri ini')+'? Riwayat absensi tetap tersimpan, tetapi santri tidak bisa login lagi.')) return;
    try { await postApi({ action:'hapusSantri', pin:S.pin, nis:d.nis }); toast('Santri dihapus'); await pgCariLoad(false); pgRefreshKelas().then(pgRedo); } catch(e){ toast(e.message,'err'); }
  },
  async pgSimpanSantri(){
    const x = { action:'simpanSantri', pin:S.pin, baru:!PG.edit, nama:pgVal('pg-nama'), nis:pgVal('pg-nis'), kelas:pgVal('pg-kelas'), tgl:pgVal('pg-tgl'), ortu:pgVal('pg-ortu'), email:pgVal('pg-email'), wa:pgVal('pg-wa') };
    if (!x.nama || !x.nis) return toast('Nama dan NIS wajib diisi','warn');
    try { await postApi(x); toast(PG.edit?'Data diperbarui':'Santri ditambah'); PG.tambah = false; PG.edit = null; await pgCariLoad(false); pgRefreshKelas().then(pgRedo); } catch(e){ toast(e.message,'err'); }
  },
  async pgProsesImpor(){
    const teks = (document.getElementById('pg-impor')||{}).value || '';
    let baris = teks.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(l.includes('\t')?'\t':l.includes(';')?';':',').map(c=>c.trim()));
    if (baris.length && /^nis$/i.test(baris[0][0])) baris.shift();
    baris = baris.map(c=>({ nis:c[0], nama:c[1], kelas:c[2], tgl:c[3], ortu:c[4]||'', email:c[5]||'', wa:c[6]||'' }));
    if (!baris.length) return toast('Tempel data dulu','warn');
    try { PG.hasil = await postApi({ action:'imporSantri', pin:S.pin, baris }); PG.impor = false; await pgCariLoad(false); pgRefreshKelas().then(pgRedo); toast(PG.hasil.baru+' santri diimpor'); } catch(e){ toast(e.message,'err'); }
  },
  pgBatas(d){ PG.cfg.alfa.batas = Math.max(1, Math.min(30, PG.cfg.alfa.batas + +d.d)); PG.dirty = true; pgRedo(); },
  pgMode(d){ PG.cfg.alfa.mode = d.k; PG.dirty = true; pgRedo(); },
  pgSaluran(d){ PG.cfg.alfa[d.k] = !PG.cfg.alfa[d.k]; PG.dirty = true; pgRedo(); },
  async pgSimpan(){
    if (PG.saving) return; PG.saving = true; pgRedo();
    try {
      const r = await postApi({ action:'simpanPengaturan', pin:S.pin, pengaturan:PG.cfg });
      PG.cfg = pgSalin(r.pengaturan); PG.kelas = r.kelas; PG.dirty = false; terapkanPengaturan(r.pengaturan);
      toast('✓ Pengaturan tersimpan' + (r.trigger && r.trigger!=='tetap' ? ' · '+r.trigger : ''), /GAGAL/.test(r.trigger||'')?'warn':'');
    } catch(e){ toast(e.message,'err'); }
    PG.saving = false; pgRedo();
  }
};
function pgChange(e){
  const t = e.target;
  if (t.id==='pg-periode') { PG.cfg.alfa.periode = t.value; PG.dirty = true; pgRedo(); }
  else if (t.id==='pg-jam') { PG.cfg.alfa.jam = +t.value; PG.dirty = true; pgRedo(); }
  else if (t.id==='pg-lj') { PG.cfg.alfa.langsung.jam = +t.value; PG.dirty = true; pgRedo(); }
  else if (t.id==='pg-lm') { PG.cfg.alfa.langsung.menit = +t.value; PG.dirty = true; pgRedo(); }
  else if (t.id==='pg-cadn') { PG.cfg.cadangan.simpan = +t.value; PG.dirty = true; pgRedo(); }
  else if (t.dataset && t.dataset.pgwarna) { const [k,i] = t.dataset.pgwarna.split(':'); PG.cfg[k][+i][1] = t.value; PG.dirty = true; pgRedo(); }
}
let pgTimer = null;
document.addEventListener('input', e => { if (e.target.id==='pg-cari') { PG.q = e.target.value; clearTimeout(pgTimer); pgTimer = setTimeout(() => pgCariLoad(false), 350); } });

/* ------------------------------ Sholat per hari/minggu/bulan/tahun (orang tua & ustadz) ------------------------------ */
const SR = { dari:rkAdd(todayStr(),-29), sampai:todayStr(), preset:'30', gran:'hari', mw:1, data:null, loading:false, sel:null, req:0 };
function srPreset(p){
  const t = todayStr(); SR.preset = p;
  if (p==='7') { SR.dari = rkAdd(t,-6); SR.sampai = t; }
  else if (p==='30') { SR.dari = rkAdd(t,-29); SR.sampai = t; }
  else if (p==='bulan') { SR.dari = t.slice(0,8)+'01'; SR.sampai = t; }
  else if (p==='tahun') { SR.dari = t.slice(0,4)+'-01-01'; SR.sampai = t; }
  else if (p==='12') { SR.dari = rkAdd(t,-364); SR.sampai = t; }
  srFixGran();
}
function srFixGran(){ if (SR.gran==='hari' && rkDiff(SR.dari, SR.sampai)>120) { SR.gran = 'minggu'; toast('Rentang panjang → ditampilkan per minggu'); } }
function srTren(seri){
  const pts = seri.filter(x=>x.persen!=null); if (pts.length < 2) return '<div class="muted" style="font-size:13px">Belum cukup data untuk tren.</div>';
  const W = 320, H = 110, P = 12, n = seri.length, xs = i => P + i*(W-2*P)/Math.max(1,n-1), ys = v => H-P-(H-2*P)*v/100;
  let d = '', pen = false; seri.forEach((x,i)=>{ if (x.persen==null) { pen = false; return; } d += (pen?' L':' M')+xs(i)+','+ys(x.persen); pen = true; });
  return `<svg viewBox="0 0 ${W} ${H+20}" style="width:100%"><line x1="${P}" x2="${W-P}" y1="${ys(100)}" y2="${ys(100)}" stroke="rgba(110,125,145,.25)" stroke-dasharray="3 4"/><line x1="${P}" x2="${W-P}" y1="${ys(50)}" y2="${ys(50)}" stroke="rgba(110,125,145,.25)" stroke-dasharray="3 4"/>

function demoSholatRentang(p, s){
  const dari = p.dari, sampai = p.sampai, n = rkDiff(dari, sampai);
  if (n < 1) throw new Error('Tanggal "sampai" harus sama atau setelah "dari"');
  if (n > 1830) throw new Error('Rentang maksimal 5 tahun');
  const gran = p.gran || 'hari', mw = +p.mulaiMinggu, bk = rkBuckets(dari, sampai, gran, mw);
  const hash = x => { let h = 2166136261; for (let i=0;i<x.length;i++) { h ^= x.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h>>>13; h = Math.imul(h, 0x5bd1e995); h ^= h>>>15; return h>>>0; };
  const rnd = x => (hash(x) % 10000)/10000, ks = STATUS_SHOLAT.map(x=>x[0]);
  const nol = () => { const o = {}; ks.forEach(k=>o[k]=0); return o; };
  const idx = {}; bk.forEach((x,i) => { for (let t=x.mulai; t<=x.akhir; t=rkAdd(t,1)) idx[t] = i; });
  const seri = bk.map(x => Object.assign({ label:x.label, mulai:x.mulai, akhir:x.akhir }, nol())), total = nol(), pw = {}, hari = {};
  WAKTU.forEach(w => pw[w] = Object.assign({ waktu:w }, nol()));
  const bias = rnd('b'+s.nis)*0.14;
  Object.keys(idx).forEach(t => WAKTU.forEach(w => {
    const r = rnd(s.nis+t+w), k = r<0.74-bias?'Berjamaah':r<0.86?'Masbuq':r<0.92?'Uzur':'Alfa';
    seri[idx[t]][k]++; total[k]++; pw[w][k]++; hari[t] = 1;
  }));
  const pct = o => { const tt = ks.reduce((a,k)=>a+o[k],0); return tt ? Math.round(1000*o.Berjamaah/tt)/10 : null; };
  seri.forEach(x => x.persen = pct(x)); total.persen = pct(total);
  return { dari, sampai, gran, mulaiMinggu:mw, seri, total, hariTercatat:Object.keys(hari).length, hariKalender:n, waktu:WAKTU.map(w=>{ const o = pw[w]; o.persen = pct(o); return o; }) };
}
function demoPerSesi(cur){
  if (SESI_KELAS.length < 2) return [];
  return SESI_KELAS.map((n,i)=>{ const o = { sesi:n, Hadir:Math.max(0,cur.Hadir-(i%3)), Izin:cur.Izin, Sakit:cur.Sakit, Alfa:cur.Alfa+(i%2) }; const tt = o.Hadir+o.Izin+o.Sakit+o.Alfa; o.persen = tt ? Math.round(1000*o.Hadir/tt)/10 : null; return o; });
}

function printHtml(judul, body){
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const w = f.contentWindow, doc = w.document;
  doc.open(); doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(judul)}</title><style>
    @page{size:A4;margin:14mm}body{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:12.5px;line-height:1.45}h1{font-size:20px;margin:0}h2{font-size:14px;margin:16px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
    table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:5px 8px;text-align:left}th{background:#eee}.k{display:inline-block;border:1px solid #444;border-radius:8px;padding:10px;margin:6px;width:44%;vertical-align:top;page-break-inside:avoid}.big{font-size:26px;letter-spacing:4px;font-weight:700}</style></head><body>${body}<\/body><\/html>`);
  doc.close();
  setTimeout(() => { try { w.focus(); w.print(); } catch(e){ toast('Cetak tidak didukung di perangkat ini', 'err'); } setTimeout(() => f.remove(), 2500); }, 350);
}
function cetakRapor(d){
  const k = d.kelas.ringkas, s = d.sholat.ringkas, t = d.tahfidz, a = d.alfa;

function unduhCsv(nama, kolom, baris){
  const q = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const isi = 'sep=;\r\n' + [kolom].concat(baris).map(r => r.map(q).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + isi], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nama; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

      if (ok) { S.saved[nis] = { surat_ayat }; closeSheet(); refreshCard(nis); } else busy(false);
    }
  } catch(err){ toast(err.message, 'err'); busy(false); }
});

    }
    case 'daftarSantri': { const q = String(b.q||'').toLowerCase(); const all = DEMO_SANTRI.filter(s=>!q || s.nama.toLowerCase().includes(q) || s.nis.includes(q)); const m = b.mulai||0;
      return { total:all.length, baris:all.slice(m, m+(b.batas||50)).map(s=>({ nis:s.nis, nama:s.nama, kelas:s.kelas, tgl:s.tgl, ortu:s.ortu||'', email:s.email||'', wa:s.wa||'' })) }; }
    case 'simpanSantri': { const x = demoCekSantri(b, !!b.baru); const i = DEMO_SANTRI.findIndex(s=>s.nis===x.nis);
      if (b.baru && i>=0) throw new Error('NIS '+x.nis+' sudah dipakai'); if (!b.baru && i<0) throw new Error('Santri tidak ditemukan');
      if (i>=0) { const o = DEMO_SANTRI[i]; Object.assign(o, { nama:x.nama, kelas:x.kelas, tgl:x.tgl||o.tgl, ortu:x.ortu, email:x.email, wa:x.wa }); } else DEMO_SANTRI.unshift(x);
      return { nis:x.nis, baru:i<0 }; }
    case 'hapusSantri': { const i = DEMO_SANTRI.findIndex(s=>s.nis===String(b.nis)); if (i<0) throw new Error('Santri tidak ditemukan'); DEMO_SANTRI.splice(i,1); return { dihapus:b.nis }; }
    case 'imporSantri': { let baru = 0, lewat = 0; const gagal = [];
      (b.baris||[]).forEach((r,i)=>{ try { const x = demoCekSantri(r, true); if (DEMO_SANTRI.some(s=>s.nis===x.nis)) { lewat++; return; } DEMO_SANTRI.unshift(x); baru++; } catch(e){ gagal.push({ baris:i+1, alasan:e.message }); } });
      return { baru, dilewati:lewat, gagal:gagal.slice(0,20), jumlahGagal:gagal.length }; }
    case 'rekap': return demoRekap(b);
    case 'dashboardSantri': { const x = DEMO_SANTRI.find(y=>y.nis===String(b.nis)); if (!x) throw new Error('Santri tidak ditemukan'); return demoGet({ action:'dashboard', nis:x.nis, tgl:x.tgl, bulan:b.bulan }); }
    case 'sholatRentangSantri': { const x = DEMO_SANTRI.find(y=>y.nis===String(b.nis)); if (!x) throw new Error('Santri tidak ditemukan'); return demoGet(Object.assign({}, b, { action:'sholatRentang', nis:x.nis, tgl:x.tgl })); }
    case 'tahfidzRentangSantri': { const x = DEMO_SANTRI.find(y=>y.nis===String(b.nis)); if (!x) throw new Error('Santri tidak ditemukan'); return demoGet(Object.assign({}, b, { action:'tahfidzRentang', nis:x.nis, tgl:x.tgl })); }
    case 'kelas': return demoKelasSemua().filter(k=>id.role==='admin'||!id.kelas.length||id.kelas.includes(k));
    case 'santri': { const iz = {}; DM.izin.forEach(x=>{ if (x.status==='Disetujui' && x.mulai<=b.tanggal && x.selesai>=b.tanggal) iz[x.nis] = { jenis:x.jenis, alasan:x.alasan }; }); return { tanggal:b.tanggal, santri:DEMO_SANTRI.filter(s=>s.kelas===b.kelas).map(s=>({nis:s.nis,nama:s.nama})), tersimpan:{}, izin:iz }; }
    default: return { baru:(b.items||[]).length, diperbarui:0 };
  }
}

/* ------------------------------ Boot ------------------------------ */
(function boot(){
  const o = store.get('sapa_ortu'), a = store.get('sapa_admin');
  if (o) { S.role='ortu'; S.cred=o; S.view='ortu'; render(); loadDash(); }
  else if (a) { S.role='admin'; S.pin=a; S.user=store.get('sapa_adminu')||''; initAdmin(); }
  else { render(); getApi({ action:'loginInfo' }).then(i => { if (i && i.mode && i.mode!==S.ortuMode) { S.ortuMode = i.mode; if (S.view==='login') render(); } }).catch(()=>{}); }
  window.addEventListener('online', flushOutbox);
  flushOutbox();
})();
</script>
