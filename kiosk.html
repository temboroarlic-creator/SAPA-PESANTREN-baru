<script>
/* Tema SAPA Pesantren — pemilih & penyimpan tema (dipakai index.html & kiosk.html).
 * Pilihan disimpan di perangkat masing-masing (localStorage). */
(function () {
  var TEMAS = [
    ['kaca', 'Kaca', 'Efek kaca ala iPhone', 'linear-gradient(135deg,#6ee7b7,#93c5fd)', ['rgba(255,255,255,.8)', 'rgba(255,255,255,.55)']],
    ['samsung', 'Samsung', 'Datar bergaya One UI — paling ringan', '#f2f3f5', ['#ffffff', '#3e91ff']],
    ['gelap', 'Gelap', 'Nyaman di ruangan redup, hemat baterai', '#0d1217', ['#232f3b', '#34d399']],
    ['hijau', 'Hijau Pesantren', 'Datar, hijau dan krem', '#f4f1e8', ['#ffffff', '#15803d']]
  ];
  var META = { kaca: '#0f766e', samsung: '#f2f3f5', gelap: '#0d1217', hijau: '#15803d' };

  function get() { try { return localStorage.getItem('sapa_tema') || 'kaca'; } catch (e) { return 'kaca'; } }
  function apply(t) {
    if (!META[t]) t = 'kaca';
    var h = document.documentElement;
    if (t === 'kaca') h.removeAttribute('data-tema'); else h.setAttribute('data-tema', t);
    var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', META[t]);
  }
  function set(t) {
    try { localStorage.setItem('sapa_tema', t); } catch (e) {}
    var h = document.documentElement; h.classList.add('tema-anim'); apply(t);
    clearTimeout(set._t); set._t = setTimeout(function () { h.classList.remove('tema-anim'); }, 600);
  }
  function close() { var r = document.getElementById('tm-root'); if (r) r.remove(); }
  function open() {
    close();
    var cur = get(), r = document.createElement('div'); r.id = 'tm-root';
    r.innerHTML = '<div class="tm-scrim" data-tm="x"></div><div class="tm-sheet"><h3>Tema tampilan</h3><p>Pilihan hanya berlaku di perangkat ini.</p>' +
      TEMAS.map(function (t) {
        return '<button class="tm-opt' + (t[0] === cur ? ' on' : '') + '" data-tm="' + t[0] + '"><span class="tm-sw" style="background:' + t[3] + '"><i style="background:' + t[4][0] + '"></i><i style="background:' + t[4][1] + '"></i></span>' +
          '<div><b>' + t[1] + '</b><span>' + t[2] + '</span></div>' + (t[0] === cur ? '<em class="tm-ck" style="font-style:normal">✓</em>' : '') + '</button>';
      }).join('') + '</div>';
    r.addEventListener('click', function (e) {
      var el = e.target.closest('[data-tm]'); if (!el) return;
      if (el.dataset.tm !== 'x') set(el.dataset.tm);
      close();
    });
    document.body.appendChild(r);
  }
  apply(get());
  window.SapaTema = { open: open, set: set, get: get };
})();

</script>

<div class="scene"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<div id="toast"></div>
<main id="app"></main>

<script>
const CFG = window.SAPA_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const initials = n => String(n||'?').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const WAKTU = (() => { try { const a = JSON.parse(localStorage.getItem('kiosk_sesi') || 'null'); if (Array.isArray(a) && a.length) return a; } catch(e){} return ['Subuh','Dzuhur','Ashar','Maghrib','Isya']; })();
const SESI_KELAS = (() => { try { const a = JSON.parse(localStorage.getItem('kiosk_sesik') || 'null'); if (Array.isArray(a) && a.length) return a; } catch(e){} return []; })();
const defaultWaktu = () => { const h = new Date().getHours(); return h<10?'Subuh':h<15?'Dzuhur':h<18?'Ashar':h<19?'Maghrib':'Isya'; };
const store = { get(k){ try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }, del(k){ try{localStorage.removeItem(k);}catch(e){} } };

const MATCH_DISTANCE = 0.5;   // makin kecil makin ketat (0.6 = bawaan face-api)
const CONFIRM_FRAMES = 2;     // wajah harus cocok di N frame berturut-turut
const MIN_FACE_RATIO = 0.22;
const MIN_MARGIN = 0.04;     // jarak ke kandidat terbaik harus lebih kecil dari kandidat ke-2 (santri berbeda) minimal sekian
const MAX_LIST = 50;         // batas baris daftar pada layar pendaftaran (gunakan pencarian)
const LIVE_TIMEOUT = 9000;  // batas waktu tantangan wajah hidup (ms)
const YAW_DELTA = 0.10;     // seberapa jauh kepala harus menoleh (rasio hidung terhadap lebar rahang)
const EAR_RATIO = 0.70;     // mata dianggap tertutup jika < 70% bukaan awal  // lebar wajah minimal terhadap lebar video (santri harus cukup dekat)

const K = { view:'login', pin:null, roster:[], kelasList:[], jenis:'kelas', waktu:defaultWaktu(), kelas:'', stream:null, running:false, busy:false, matcher:null, q:'', mirip:0, byNis:{}, scanned:{}, streak:null, unk:0, enrolNis:null, lastScans:[], sesiK:(JSON.parse(localStorage.getItem('kiosk_sesik')||'[]')[0]||''), modelsReady:false, dKelas:'', live:false, phase:'id', chal:null, cNis:null, cStart:0, base:[], hold:0, vOk:0, vStart:0, cfail:0 };

/* ---------- API ---------- */
async function post(body){
  if (!CFG.API_URL) throw new Error('API_URL belum diisi di bagian ISI DI SINI (atas file)');
  let res; try { res = await fetch(CFG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({pin:K.pin}, body)) }); }
  catch(e){ const er = new Error('Tidak ada koneksi internet'); er.offline = true; throw er; }
  let j; try { j = await res.json(); } catch(e){ throw new Error('Respon server tidak valid'); }
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan'); return j.data;
}
const outbox = { get:()=>store.get('kiosk_outbox')||[], set:v=>store.set('kiosk_outbox',v) };
async function flush(){ if(!navigator.onLine||!K.pin) return; const q = outbox.get(); if(!q.length) return; const rest = []; let n = 0;
  for (const b of q){ try { await post(b); n++; } catch(e){ if (e.offline) rest.push(b); } }
  outbox.set(rest); if (n) toast('✓ '+n+' absen offline terkirim'); }
let tt; function toast(m,t){ const e=$('#toast'); e.className='show '+(t||''); e.textContent=m; clearTimeout(tt); tt=setTimeout(()=>e.className='',3400); }

/* ---------- Pustaka wajah ---------- */
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('Gagal memuat pustaka wajah (cek internet / FACE_LIB_URL)')); document.head.appendChild(s); }); }
async function ensureModels(setMsg){
  if (K.modelsReady) return;
  // Utama: URL di bagian ISI DI SINI (atas file). Cadangan: GitHub Pages milik pustaka ini.
  const libs = [CFG.FACE_LIB_URL, 'https://vladmandic.github.io/face-api/dist/face-api.js'].filter(Boolean);
  const mods = [CFG.FACE_MODEL_URL, 'https://vladmandic.github.io/face-api/model/'].filter(Boolean);
  if (!window.faceapi) {
    setMsg('Memuat pustaka wajah…');
    let err = null;
    for (const u of libs) { try { await loadScript(u); err = null; break; } catch(e){ err = e; } }
    if (err || !window.faceapi) throw err || new Error('Pustaka wajah tidak termuat');
  }
  try { await faceapi.tf.setBackend('webgl'); await faceapi.tf.ready(); } catch(e){}
  setMsg('Memuat model pengenal wajah (±7 MB, sekali saja)…');
  let last = null;
  for (const u of mods) {
    try {
      await faceapi.nets.tinyFaceDetector.loadFromUri(u);
      await faceapi.nets.faceLandmark68Net.loadFromUri(u);
      await faceapi.nets.faceRecognitionNet.loadFromUri(u);
      K.modelsReady = true; setMsg('Menyiapkan mesin pengenal…'); await warmUp(); return;
    } catch(e){ last = e; }
  }
  throw new Error('Gagal memuat model wajah (cek internet / FACE_MODEL_URL)');
}
/* pemanasan: kompilasi mesin sekali di awal agar pemindaian pertama tidak tersendat */
async function warmUp(){
  try { const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'); x.fillStyle = '#888'; x.fillRect(0,0,160,160);
    await faceapi.detectSingleFace(c, detOpts()).withFaceLandmarks();
    await faceapi.nets.faceRecognitionNet.computeFaceDescriptor(c); } catch(e){}
}
const detOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize:224, scoreThreshold:0.5 });
async function startCam(){
  stopCam();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('Kamera butuh alamat HTTPS dan browser terbaru');
  K.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:480}, height:{ideal:360}, frameRate:{ideal:24} }, audio:false });
  const v = $('#cam'); v.srcObject = K.stream; await v.play();
}
function stopCam(){ K.running = false; document.documentElement.classList.remove('kam'); if (K.stream) { K.stream.getTracks().forEach(t=>t.stop()); K.stream = null; } }

async function ambilSampel(){
  const btn = $('#btn-cap'); btn.disabled = true;
  const steps = ['Hadap lurus ke kamera','Tengok sedikit ke kiri','Tengok sedikit ke kanan'], hasil = [];
  for (let i=0;i<steps.length;i++){
    let got = null;
    for (let t=0;t<12 && !got;t++){
      setHint('Sampel '+(i+1)+'/3 — '+steps[i]); await sleep(t?350:1400);
      const r = await faceapi.detectSingleFace($('#cam'), detOpts()).withFaceLandmarks().withFaceDescriptor();
      if (r && r.detection.box.width/$('#cam').videoWidth > MIN_FACE_RATIO) got = Array.from(r.descriptor).map(x=>Math.round(x*1e4)/1e4);
      else setHint('Wajah belum terlihat jelas — dekatkan & hadap kamera');
    }
    if (!got) { setHint('Gagal mengambil sampel. Coba lagi.'); btn.disabled = false; return; }
    hasil.push(got);
  }
  setHint('Menyimpan…');
  try {
    await post({ action:'wajahDaftar', nis:K.enrolNis, descriptors:hasil });
    K.byNis[K.enrolNis].terdaftar = true; K.byNis[K.enrolNis].d = hasil; idb.put(K.enrolNis, { d:hasil }).catch(()=>{});
    toast('✓ Wajah '+K.byNis[K.enrolNis].nama+' terdaftar'); K.matcher = null; K.view = 'daftar'; render();
  } catch(e){ toast(e.message,'err'); setHint('Gagal menyimpan'); btn.disabled = false; }
}

/* ---------- Kios scan ---------- */
/* Pencocokan wajah dilakukan di perangkat atas SEMUA santri terdaftar — santri tidak perlu memilih/mengetik nama.
   Jarak = rata-rata jarak Euclid ke tiap sampel; kandidat diterima bila < MATCH_DISTANCE dan
   unggul dari santri lain minimal MIN_MARGIN (mencegah salah kenal pada wajah mirip). */
function buildMatcher(){
  const pool = K.roster.filter(s => s.terdaftar && s.d && s.d.length && (!K.kelas || s.kelas===K.kelas))
    .map(s => ({ nis:s.nis, d:s.d.map(a => Float32Array.from(a)) }));
  if (!pool.length) return null;
  const dist = (a, b) => { let t = 0; for (let i=0;i<128;i++){ const x = a[i]-b[i]; t += x*x; } return Math.sqrt(t); };
  return { size:pool.length, findBestMatch(desc){
    let b1 = 9, n1 = null, b2 = 9;
    for (const p of pool) {
      let m = 0; for (const d of p.d) m += dist(desc, d); m /= p.d.length;
      if (m < b1) { b2 = b1; b1 = m; n1 = p.nis; } else if (m < b2) b2 = m;
    }
    if (n1 && b1 < MATCH_DISTANCE) return (b2 - b1 >= MIN_MARGIN) ? { label:n1, distance:b1 } : { label:'unknown', mirip:true, distance:b1 };
    return { label:'unknown', distance:b1 };
  } };
}
async function startScan(){
  try {
    await ensureModels(setHint);
    K.matcher = buildMatcher();
    if (!K.matcher) { setHint('Belum ada wajah terdaftar untuk pilihan ini'); toast('Daftarkan wajah santri dulu','warn'); return; }
    await startCam();
    K.scanned = {}; K.lastScans = []; K.phase = 'id'; K.streak = null; K.unk = 0; K.busy = false; K.running = true; document.documentElement.classList.add('kam'); updateCount();
    setHint('Hadapkan wajah ke kamera'); loop();
  } catch(e){ setHint(e.message); toast(e.message,'err'); }
}
function targetNis(){ return K.roster.filter(s=>!K.kelas || s.kelas===K.kelas).length; }
function updateCount(){ const c = $('#cnt'); if (c) { c.textContent = Object.keys(K.scanned).length; $('#cnt-t').textContent = 'hadir dari '+targetNis()+' santri'; }
  const r = $('#recent'); if (r) r.innerHTML = K.lastScans.slice(0,6).map(n=>`<span class="chip on">${esc(n)}</span>`).join(''); }
const biggest = a => a.sort((x,y)=>y.detection.box.width-x.detection.box.width)[0];
const setRing = c => { const r = $('#ring'); if (r) r.className = 'ring ' + (c||''); };
function earOf(p){ const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y); return (d(p[1],p[5])+d(p[2],p[4]))/(2*d(p[0],p[3])); }
function resetFlow(msg){ K.phase='id'; K.streak=null; K.chal=null; K.cNis=null; K.base=[]; K.hold=0; K.vOk=0; K.unk=0; setRing(''); setHint(msg||'Hadapkan wajah ke kamera'); }
/* Deteksi wajah hidup: setelah wajah dikenali, santri diminta satu gerakan acak (pejam / noleh),
   lalu menghadap lurus lagi dan identitasnya diverifikasi ulang. Foto diam akan gagal. */
function startChallenge(nis){
  K.phase='challenge'; K.cNis=nis; K.chal=Math.random()<.5?'pejam':'noleh'; K.cStart=Date.now(); K.base=[]; K.hold=0; K.cfail=0;
  setRing('scan'); setHint('');
}
function challengeStep(f){
  const lm=f.landmarks, P=lm.positions;
  const val = K.chal==='pejam' ? (earOf(lm.getLeftEye())+earOf(lm.getRightEye()))/2 : (P[30].x-P[0].x)/(P[16].x-P[0].x);
  if (K.base.length < 2) { K.base.push(val); return false; }
  const ok = K.chal==='pejam' ? val < Math.max.apply(null,K.base)*EAR_RATIO : Math.abs(val-(K.base[0]+K.base[1])/2) > YAW_DELTA;
  K.hold = ok ? K.hold+1 : 0;
  return K.hold >= 2;
}
async function loop(){
  if (!K.running) return;
  const v = $('#cam');
  if (v && v.readyState >= 2 && !K.busy) {
    try {
      if (K.phase === 'challenge') {
        const all = await faceapi.detectAllFaces(v, detOpts()).withFaceLandmarks();
        if (!K.running) return;
        const f = biggest(all);
        if (Date.now()-K.cStart > LIVE_TIMEOUT) resetFlow('Waktu habis — ulangi, hadap kamera');
        else if (!f) { if (++K.cfail > 8) resetFlow(); }
        else { K.cfail = 0; if (challengeStep(f)) { K.phase='verify'; K.vOk=0; K.vStart=Date.now(); setRing('ok'); setHint('Bagus! Hadap lurus ke kamera'); } }
      } else {
        const all = await faceapi.detectAllFaces(v, detOpts()).withFaceLandmarks().withFaceDescriptors();
        if (!K.running) return;
        const big = biggest(all);
        if (!big) {
          if (K.phase==='verify') { if (Date.now()-K.vStart > 6000) resetFlow('Waktu habis — ulangi'); }
          else { K.streak = null; K.unk = 0; setHint('Hadapkan wajah ke kamera'); }
        } else if (big.detection.box.width / v.videoWidth < MIN_FACE_RATIO) {
          if (K.phase==='id') K.streak = null; setHint('Dekatkan wajah ke kamera');
        } else {
          const m = K.matcher.findBestMatch(big.descriptor);
          if (K.phase === 'verify') {
            if (m.label === K.cNis) { if (++K.vOk >= 2) await konfirmasi(K.cNis); }
            else if (Date.now()-K.vStart > 6000) resetFlow('Wajah tidak cocok — ulangi');
          } else if (m.label !== 'unknown') {
            K.unk = 0;
            K.streak = (K.streak && K.streak.nis === m.label) ? { nis:m.label, n:K.streak.n+1 } : { nis:m.label, n:1 };
            if (K.streak.n >= CONFIRM_FRAMES) { await konfirmasi(m.label); }
            else setHint('Mengenali…');
          } else { K.streak = null; K.unk++; setHint(K.unk >= 10 ? (m.mirip ? 'Wajah mirip santri lain — dekatkan & hadap lurus' : 'Wajah belum terdaftar — hubungi ustadz') : 'Mengenali…'); }
        }
      }
    } catch(e){ /* lewati frame bermasalah */ }
  }
  setTimeout(loop, 40);
}
function showResult(s, teks, tipe){
  const r = $('#res'); if (!r) return;
  r.innerHTML = `<div class="result ${tipe}"><div class="avatar">${esc(initials(s.nama))}</div><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:18px">${esc(s.nama)}</div><div class="muted" style="font-size:13px">${esc(s.kelas)}</div></div><div style="font-weight:800;font-size:16px">${esc(teks)}</div></div>`;
  setTimeout(()=>{ if (r) r.innerHTML=''; }, 1200);
}
async function konfirmasi(nis){
  K.busy = true; const s = K.byNis[nis];
  if (K.scanned[nis]) { showResult(s, 'Sudah absen ✓', 'info'); beep(true); await sleep(900); }
  else {
    if (SESI_KELAS.length && !SESI_KELAS.includes(K.sesiK)) K.sesiK = SESI_KELAS[0];
    const body = { action:'absenWajah', nis, tanggal:todayStr(), jenis:K.jenis, waktu:K.waktu, sesi:K.sesiK };
    try { const r = await post(body); K.scanned[nis] = r.status; K.lastScans.unshift(s.nama); showResult(s, r.sudah ? 'Tercatat: '+r.status : (K.jenis==='sholat'?'Berjamaah ✓':'Hadir ✓'), 'ok'); beep(true); }
    catch(e){
      if (e.offline) { outbox.set(outbox.get().concat([body])); K.scanned[nis] = 'offline'; K.lastScans.unshift(s.nama); showResult(s, 'Hadir ✓ (offline)', 'ok'); beep(true); }
      else { showResult(s, e.message, 'err'); beep(false); }
    }
    updateCount(); await sleep(900);
  }
  K.phase='id'; K.chal=null; K.cNis=null; K.vOk=0; K.streak=null; K.base=[]; setRing(''); setHint('Hadapkan wajah ke kamera'); K.busy = false;
}
async function tutupAbsensi(){
  const sesi = K.jenis==='sholat' ? 'sholat '+K.waktu : 'kelas'+(SESI_KELAS.length>1?' '+K.sesiK:'');
  const cakupan = K.kelas || 'SEMUA kelas';
  if (!confirm('Tutup absensi '+sesi+' ('+cakupan+')?\n\nSantri yang belum tercatat (termasuk yang belum Izin/Sakit diinput) akan otomatis ditandai ALFA.')) return;
  try { const r = await post({ action:'tutupAbsensi', tanggal:todayStr(), jenis:K.jenis, waktu:K.waktu, sesi:K.sesiK, kelas:K.kelas }); toast(r.alfa ? r.alfa+' santri ditandai Alfa' : 'Semua santri sudah tercatat ✓', r.alfa?'warn':''); }
  catch(e){ toast(e.message,'err'); }
}

/* ---------- Aksi ---------- */
/* Cache ciri wajah di perangkat (IndexedDB): ribuan santri tidak diunduh ulang tiap pembukaan.
   Server hanya mengirim ciri wajah yang berubah sejak sinkron terakhir. */
const idb = {
  db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((ok,no)=>{ const r = indexedDB.open('sapa_kiosk',1); r.onupgradeneeded = () => r.result.createObjectStore('wajah'); r.onsuccess = () => { this.db = r.result; ok(r.result); }; r.onerror = () => no(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((ok,no)=>{ const t = db.transaction('wajah', mode), st = t.objectStore('wajah'); const out = fn(st); t.oncomplete = () => ok(out && out.result !== undefined ? out.result : out); t.onerror = () => no(t.error); }); },
  all(){ return this.tx('readonly', st => { const o = {}; const r = st.openCursor(); r.onsuccess = () => { const c = r.result; if (c) { o[c.key] = c.value; c.continue(); } }; return o; }); },
  put(nis, v){ return this.tx('readwrite', st => st.put(v, nis)); },
  del(nis){ return this.tx('readwrite', st => st.delete(nis)); },
  clear(){ return this.tx('readwrite', st => st.clear()); }
};
async function loadRoster(){
  let cache = {}, since = localStorage.getItem('kiosk_sync') || '';
  try { cache = await idb.all(); } catch(e){ cache = {}; since = ''; }
  if (!Object.keys(cache).length) since = '';
  let data = await post({ action:'wajahSinkron', sejak:since });
  const ids = new Set(data.santri.filter(x=>x.terdaftar).map(x=>x.nis));
  const merge = async d => {
    for (const nis of Object.keys(d)) { cache[nis] = { d:d[nis] }; try { await idb.put(nis, cache[nis]); } catch(e){} }
    for (const nis of Object.keys(cache)) if (!ids.has(nis)) { delete cache[nis]; try { await idb.del(nis); } catch(e){} }
  };
  await merge(data.d);
  if ([...ids].some(n => !cache[n])) {            // ada yang belum lengkap → sinkron penuh satu kali
    try { await idb.clear(); } catch(e){} cache = {};
    data = await post({ action:'wajahSinkron', sejak:'' }); await merge(data.d);
  }
  localStorage.setItem('kiosk_sync', data.waktu);
  if (Array.isArray(data.sesi) && data.sesi.length) { WAKTU.length = 0; data.sesi.forEach(w => WAKTU.push(w)); localStorage.setItem('kiosk_sesi', JSON.stringify(data.sesi)); if (!WAKTU.includes(K.waktu)) K.waktu = WAKTU.includes(defaultWaktu()) ? defaultWaktu() : WAKTU[0]; }
  if (Array.isArray(data.sesiKelas)) { SESI_KELAS.length = 0; data.sesiKelas.forEach(x => SESI_KELAS.push(x[0])); localStorage.setItem('kiosk_sesik', JSON.stringify(SESI_KELAS)); if (!SESI_KELAS.includes(K.sesiK)) K.sesiK = SESI_KELAS[0] || ''; }
  K.roster = data.santri.map(x => ({ nis:x.nis, nama:x.nama, kelas:x.kelas, terdaftar:x.terdaftar && !!cache[x.nis], d:(cache[x.nis]||{}).d || [] }));
  K.byNis = {}; K.roster.forEach(s=>K.byNis[s.nis]=s);
  K.kelasList = Array.from(new Set(K.roster.map(s=>s.kelas).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
}
const ACT = {
  tema(){ if (window.SapaTema) SapaTema.open(); },
  live(d, el){ K.live = el.checked; store.set('kiosk_live2', K.live); },
  jenis(d){ K.jenis = d.k; render(); }, waktu(d){ K.waktu = d.k; render(); }, sesik(d){ K.sesiK = d.k; render(); }, kelas(d){ K.kelas = d.k; render(); },
  dk(d){ K.dKelas = d.k; render(); },
  toMenu(){ K.view = 'menu'; render(); }, toDaftar(){ K.view = 'daftar'; render(); },
  async mulai(){ K.view = 'scan'; render(); },
  daftarkan(d){ K.enrolNis = d.nis; K.view = 'capture'; render(); },
  ambil: ambilSampel, tutup: tutupAbsensi,
  async hapusWajah(){ if (!confirm('Hapus data wajah santri ini?')) return; try { await post({ action:'wajahHapus', nis:K.enrolNis }); K.byNis[K.enrolNis].terdaftar = false; K.byNis[K.enrolNis].d = []; idb.del(K.enrolNis).catch(()=>{}); toast('Data wajah dihapus'); K.view = 'daftar'; render(); } catch(e){ toast(e.message,'err'); } },
  logout(){ store.del('kiosk_pin'); localStorage.removeItem('kiosk_sync'); idb.clear().catch(()=>{}); stopCam(); K.pin = null; K.view = 'login'; render(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset, el); });
document.addEventListener('input', e => { if (e.target.id === 'q-daftar') { K.q = e.target.value; const d = $('#dl'); if (d) d.innerHTML = daftarRows(); } });
document.addEventListener('submit', async e => {
  e.preventDefault(); if (e.target.id !== 'f-login') return;
  const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Memproses…';
  try { K.pin = $('#pin').value.trim(); await post({ action:'adminLogin' }); store.set('kiosk_pin', K.pin); await loadRoster(); K.view = 'menu'; render(); flush(); }
  catch(err){ toast(err.message,'err'); b.disabled = false; b.textContent = 'Masuk'; }
});
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden && K.view==='scan') { stopCam(); K.view = 'menu'; render(); } });

(async function boot(){
  const pin = store.get('kiosk_pin');
  if (pin && CFG.API_URL) { K.pin = pin; try { await post({ action:'adminLogin' }); await loadRoster(); K.view = 'menu'; } catch(e){ K.view = 'login'; } }
  render();
})();
</script>
